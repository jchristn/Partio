services:
  partio-server:
    image: jchristn77/partio-server:v0.5.0
    container_name: partio-server
    ports:
      - "8400:8400"
      - "11434:11434"
    volumes:
      - ./partio.json:/app/partio.json:ro
      - ./data:/app/data
      - ./logs:/app/logs
      - ./request-history:/app/request-history
    restart: unless-stopped

  partio-mcp:
    image: jchristn77/partio-mcp:v0.5.0
    container_name: partio-mcp
    ports:
      - "8500:8500"
    volumes:
      - ./partio.mcp.json:/app/partio.mcp.json:ro
      - ./logs:/app/logs
    restart: unless-stopped
    depends_on:
      - partio-server

  partio-dashboard:
    image: jchristn77/partio-dashboard:v0.5.0
    container_name: partio-dashboard
    ports:
      - "8401:8401"
    environment:
      - PARTIO_SERVER_URL=http://localhost:8400
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: partio-ollama
    network_mode: "service:partio-server"
    environment:
      OLLAMA_NUM_PARALLEL: "4"
      OLLAMA_MAX_LOADED_MODELS: "4"
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # Observability stack: Prometheus (metrics), Tempo (traces), Loki (logs),
  # and Grafana (dashboards). Comes up wired together with `docker compose up`.
  # ----------------------------------------------------------------------------

  prometheus:
    image: prom/prometheus:v3.5.4
    container_name: partio-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yaml'
      - '--storage.tsdb.path=/prometheus'
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - partio-prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  tempo:
    # Pinned deliberately: `latest` resolves to a v3 dev build whose config parser rejects the
    # standard ingester/compactor sections. 2.6.1 is the last known-good stable for this config.
    image: grafana/tempo:2.6.1
    container_name: partio-tempo
    command: ["-config.file=/etc/tempo.yaml"]
    ports:
      - "127.0.0.1:3200:3200"   # Tempo query API
      - "127.0.0.1:4317:4317"   # OTLP gRPC ingest
      - "127.0.0.1:4318:4318"   # OTLP HTTP ingest
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - partio-tempo-data:/var/tempo
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3200/ready"]
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  loki:
    image: grafana/loki:3.2.1
    container_name: partio-loki
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - partio-loki-data:/loki
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  otel-collector:
    # Tails Partio's rolling log files and ships them to Loki, stamped with service.name=partio,
    # so logs correlate to traces inside one Grafana window. Traces and metrics do not flow through
    # here — Partio pushes traces straight to Tempo and Prometheus scrapes the /metrics endpoints.
    image: otel/opentelemetry-collector-contrib:0.109.0
    container_name: partio-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
      - ./logs:/logs:ro
    depends_on:
      loki:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:13.0.2
    container_name: partio-grafana
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../assets/grafana:/var/lib/grafana/dashboards/partio:ro
      - partio-grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  ollama-models:
  partio-prometheus-data:
  partio-tempo-data:
  partio-loki-data:
  partio-grafana-data:
