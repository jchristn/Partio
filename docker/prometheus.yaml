global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Watson's built-in HTTP + watson.* metrics, served in-process on the main listener.
  - job_name: 'partio-server-watson'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['partio-server:8400']

  # Partio application (partio_*) metrics: processing stages, integrations, endpoint health, authz.
  - job_name: 'partio-server-app'
    metrics_path: '/v1.0/metrics'
    static_configs:
      - targets: ['partio-server:8400']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
